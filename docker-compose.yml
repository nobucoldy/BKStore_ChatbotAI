services:
  # 1. Database: PostgreSQL 16 + PGVector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bkstore-postgres
    restart: always
    environment:
      POSTGRES_DB: bkstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bkstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bkstore-network

  # 2. Backend: Node.js Express API & AI Agent
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bkstore-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/bkstore
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
    networks:
      - bkstore-network

  # 3. Frontend: Next.js 16 Storefront & Admin
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: bkstore-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - bkstore-network

volumes:
  pgdata:
    driver: local

networks:
  bkstore-network:
    driver: bridge
